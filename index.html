<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퍼스백양장로교회 청년부 출석체크</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--p:#3657d6;--p2:#edf1ff;--green:#087a4a;--red:#b42318;--amber:#9a6700}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#253faf,#5878ef);color:#fff;padding:22px 16px;box-shadow:0 3px 12px #0002}
.wrap{max-width:1100px;margin:18px auto;padding:0 14px}.hidden{display:none!important}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px #0000000c}
.login{max-width:430px;margin:60px auto}.login h2{margin-top:0}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}input,select,textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;font-size:14px;background:#fff}
button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--p);color:#fff}.soft{background:var(--p2);color:var(--p)}.danger{background:#feecec;color:var(--red)}.green{background:#e8f7ef;color:var(--green)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{background:#fff;color:var(--text);box-shadow:0 1px 3px #0001}.tab.active{background:var(--p);color:#fff}
.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
.stat{font-size:28px;font-weight:900;margin-top:5px}.muted{font-size:13px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.table{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted);background:#fafafa}
.cell{border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0}.celltop{display:flex;justify-content:space-between;gap:8px;align-items:center}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{background:#f2f4f7;border-radius:999px;padding:5px 8px;font-size:12px}
.att{border:1px solid var(--line);background:#fff;padding:7px 9px;font-size:12px}.att.on.p{background:#e8f7ef;color:var(--green)}.att.on.l{background:#fff4d8;color:var(--amber)}.att.on.a{background:#feecec;color:var(--red)}
.status{font-size:12px;margin-top:10px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center}.topbar small{opacity:.9}
@media(max-width:760px){.s4,.s6,.s8,.s12{grid-column:span 12}.row{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <div class="wrap topbar" style="margin:0 auto">
    <div><strong style="font-size:21px">퍼스백양장로교회 청년부 출석체크</strong><br><small>온라인 공동 출석관리</small></div>
    <div id="userBox" class="hidden"><span id="userEmail"></span> <button id="logoutBtn" class="soft">로그아웃</button></div>
  </div>
</header>

<div class="wrap">
  <section id="loginView" class="login card">
    <h2>로그인</h2>
    <div class="muted">관리자가 발급한 계정으로 로그인하세요.</div>
    <label>이메일</label><input id="email" type="email" autocomplete="username">
    <label>비밀번호</label><input id="password" type="password" autocomplete="current-password">
    <label style="display:flex;align-items:center;gap:7px;font-weight:500;margin-top:8px;cursor:pointer"><input id="showPassword" type="checkbox" style="width:auto;margin:0"> 비밀번호 보기</label>
    <button id="loginBtn" class="primary" style="width:100%;margin-top:14px">로그인</button>
    <div id="loginMsg" class="status"></div>
  </section>

  <main id="appView" class="hidden">
    <div class="tabs">
      <button class="tab active" data-tab="dash">대시보드</button>
      <button class="tab" data-tab="attend">출석 체크</button>
      <button class="tab" data-tab="cells">셀 관리</button>
      <button class="tab" data-tab="data">데이터</button>
    </div>

    <section id="dash" class="panel active">
      <div class="grid">
        <div class="card s4"><div class="muted">전체 인원</div><div id="nPeople" class="stat">0</div></div>
        <div class="card s4"><div class="muted">셀 수</div><div id="nCells" class="stat">0</div></div>
        <div class="card s4"><div class="muted">최근 출석률</div><div id="rate" class="stat">-</div></div>
        <div class="card s12"><h3>셀별 현황</h3><div id="summary"></div></div>
      </div>
    </section>

    <section id="attend" class="panel">
      <div class="grid">
        <div class="card s12">
          <div class="row">
            <div><label>날짜</label><input id="attDate" type="date"></div>
            <div><label>셀</label><select id="attCell"></select></div>
          </div>
          <div class="actions" style="margin-top:10px">
            <button id="allPresent" class="green">전체 출석</button>
            <button id="saveAtt" class="primary">출석 저장</button>
          </div>
        </div>
        <div class="card s12">
          <div class="table"><table><thead><tr><th>이름</th><th>역할</th><th>출석 상태</th></tr></thead><tbody id="attBody"></tbody></table></div>
        </div>
      </div>
    </section>

    <section id="cells" class="panel">
      <div class="grid">
        <div class="card s4">
          <h3>새 셀 등록</h3>
          <label>셀 이름</label><input id="cellName" placeholder="예: 믿음셀">
          <div class="row"><div><label>리더</label><input id="leader"></div><div><label>헬퍼</label><input id="helper"></div></div>
          <label>셀원 이름</label><textarea id="members" rows="8" placeholder="한 줄에 한 명씩 입력"></textarea>
          <button id="addCell" class="primary" style="margin-top:10px">셀 저장</button>
        </div>
        <div class="card s8"><h3>등록된 셀</h3><div id="cellList"></div></div>
      </div>
    </section>

    <section id="data" class="panel">
      <div class="grid">
        <div class="card s6"><h3>출석 CSV</h3><p class="muted">현재 온라인 데이터를 Excel용 CSV로 내보냅니다.</p><button id="csvBtn" class="soft">CSV 다운로드</button></div>
        <div class="card s6"><h3>온라인 상태</h3><p class="muted">Firebase Firestore와 실시간으로 동기화됩니다.</p><div id="cloudStatus">연결 중...</div></div>
      </div>
    </section>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
let cells=[], attendance={};

const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const today=()=>{const d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)}; $("attDate").value=today();
const people=c=>[...(c.leader?[{name:c.leader,role:"리더"}]:[]),...(c.helper?[{name:c.helper,role:"헬퍼"}]:[]),...(c.members||[]).map(name=>({name,role:"셀원"}))];

$("showPassword").onchange=()=>{ $("password").type=$("showPassword").checked?"text":"password"; };
$("loginBtn").onclick=async()=>{
  $("loginMsg").textContent="로그인 중...";
  try{
    await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
    $("loginMsg").textContent="";
  }catch(e){
    console.error("Firebase login error:",e);
    const code=e?.code||"unknown-error";
    const messages={
      "auth/invalid-credential":"이메일 또는 비밀번호가 올바르지 않습니다.",
      "auth/user-not-found":"등록되지 않은 이메일입니다.",
      "auth/wrong-password":"비밀번호가 올바르지 않습니다.",
      "auth/invalid-email":"이메일 형식을 확인해주세요.",
      "auth/unauthorized-domain":"현재 웹사이트 도메인이 Firebase 인증에서 승인되지 않았습니다.",
      "auth/operation-not-allowed":"Firebase에서 이메일/비밀번호 로그인이 활성화되어 있지 않습니다.",
      "auth/too-many-requests":"로그인 시도가 너무 많아 일시적으로 제한되었습니다. 잠시 후 다시 시도해주세요.",
      "auth/network-request-failed":"네트워크 연결을 확인해주세요."
    };
    $("loginMsg").textContent=`${messages[code]||"로그인에 실패했습니다."} (${code})`;
  }
};
$("logoutBtn").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  $("loginView").classList.toggle("hidden",!!u); $("appView").classList.toggle("hidden",!u); $("userBox").classList.toggle("hidden",!u);
  $("userEmail").textContent=u?.email||"";
  if(u) startSync();
});

let unsubCells=null,unsubAtt=null;
function startSync(){
  if(unsubCells)unsubCells(); if(unsubAtt)unsubAtt();
  unsubCells=onSnapshot(collection(db,"cells"),s=>{cells=s.docs.map(d=>({id:d.id,...d.data()}));renderAll();$("cloudStatus").textContent="온라인 연결됨";},()=>$("cloudStatus").textContent="연결 오류");
  unsubAtt=onSnapshot(collection(db,"attendance"),s=>{attendance={};s.docs.forEach(d=>attendance[d.id]=d.data());renderAll();},()=>{});
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.tab).classList.add("active");});

$("addCell").onclick=async()=>{
  const name=$("cellName").value.trim(); if(!name)return alert("셀 이름을 입력해주세요.");
  const members=$("members").value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);
  await addDoc(collection(db,"cells"),{name,leader:$("leader").value.trim(),helper:$("helper").value.trim(),members,createdAt:Date.now()});
  $("cellName").value=$("leader").value=$("helper").value=$("members").value="";
};
window.delCell=async id=>{if(confirm("이 셀을 삭제할까요?"))await deleteDoc(doc(db,"cells",id));};
window.editCell=async id=>{
  const c=cells.find(x=>x.id===id); if(!c)return;
  const name=prompt("셀 이름",c.name); if(name===null)return;
  const leader=prompt("리더",c.leader||""); if(leader===null)return;
  const helper=prompt("헬퍼",c.helper||""); if(helper===null)return;
  const members=prompt("셀원 (쉼표로 구분)",(c.members||[]).join(", ")); if(members===null)return;
  await updateDoc(doc(db,"cells",id),{name:name.trim()||c.name,leader:leader.trim(),helper:helper.trim(),members:members.split(",").map(x=>x.trim()).filter(Boolean)});
};

function renderCells(){
  $("cellList").innerHTML=cells.length?cells.map(c=>`<div class="cell"><div class="celltop"><div><strong>${esc(c.name)}</strong><div class="muted">리더 ${esc(c.leader||"-")} · 헬퍼 ${esc(c.helper||"-")} · ${people(c).length}명</div></div><div class="actions"><button class="soft" onclick="editCell('${c.id}')">수정</button><button class="danger" onclick="delCell('${c.id}')">삭제</button></div></div><div class="chips">${people(c).map(p=>`<span class="chip">${esc(p.name)} · ${p.role}</span>`).join("")}</div></div>`).join(""):'<p class="muted">등록된 셀이 없습니다.</p>';
}
function renderSelect(){const prev=$("attCell").value;$("attCell").innerHTML='<option value="">셀 선택</option>'+cells.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");if(cells.some(c=>c.id===prev))$("attCell").value=prev;}
$("attCell").onchange=renderAtt;$("attDate").onchange=renderAtt;

function attDocId(date,id){return `${date}__${id}`}
function renderAtt(){
  const c=cells.find(x=>x.id===$("attCell").value), date=$("attDate").value;
  if(!c){$("attBody").innerHTML='<tr><td colspan="3" class="muted">셀을 선택해주세요.</td></tr>';return;}
  const rec=attendance[attDocId(date,c.id)]?.records||{};
  $("attBody").innerHTML=people(c).map((p,i)=>{const k=`${p.role}:${p.name}:${i}`,s=rec[k]||"";return `<tr data-k="${esc(k)}" data-s="${s}"><td>${esc(p.name)}</td><td>${p.role}</td><td><div class="actions"><button class="att p ${s==="present"?"on":""}" onclick="pick(this,'present')">출석</button><button class="att l ${s==="late"?"on":""}" onclick="pick(this,'late')">지각</button><button class="att a ${s==="absent"?"on":""}" onclick="pick(this,'absent')">결석</button></div></td></tr>`}).join("");
}
window.pick=(btn,s)=>{const r=btn.closest("tr");r.dataset.s=s;r.querySelectorAll(".att").forEach(x=>x.classList.remove("on"));btn.classList.add("on")};
$("allPresent").onclick=()=>document.querySelectorAll("#attBody tr[data-k]").forEach(r=>{r.dataset.s="present";r.querySelectorAll(".att").forEach(x=>x.classList.remove("on"));r.querySelector(".p")?.classList.add("on")});
$("saveAtt").onclick=async()=>{
  const date=$("attDate").value,id=$("attCell").value,c=cells.find(x=>x.id===id);if(!date||!c)return alert("날짜와 셀을 선택해주세요.");
  const records={};document.querySelectorAll("#attBody tr[data-k]").forEach(r=>{if(r.dataset.s)records[r.dataset.k]=r.dataset.s});
  await setDoc(doc(db,"attendance",attDocId(date,id)),{date,cellId:id,cellName:c.name,records,updatedAt:Date.now()});
  alert("출석이 온라인에 저장되었습니다.");
};

function renderDash(){
  $("nPeople").textContent=cells.reduce((s,c)=>s+people(c).length,0);$("nCells").textContent=cells.length;
  const docs=Object.values(attendance).sort((a,b)=>(b.date||"").localeCompare(a.date||"")); const last=docs[0]?.date;
  let ok=0,total=0;if(last)docs.filter(x=>x.date===last).forEach(x=>Object.values(x.records||{}).forEach(v=>{total++;if(v==="present"||v==="late")ok++;}));
  $("rate").textContent=total?Math.round(ok/total*100)+"%":"-";
  $("summary").innerHTML=cells.length?cells.map(c=>{let r="-";if(last){const d=attendance[attDocId(last,c.id)],v=Object.values(d?.records||{});if(v.length)r=Math.round(v.filter(x=>x==="present"||x==="late").length/v.length*100)+"%";}return `<div class="cell"><strong>${esc(c.name)}</strong><div class="muted">${people(c).length}명 · 최근 출석률 ${r}</div></div>`}).join(""):'<p class="muted">셀을 등록해주세요.</p>';
}
$("csvBtn").onclick=()=>{
  const rows=[["날짜","셀","이름","역할","상태"]];
  Object.values(attendance).sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(a=>{
    const c=cells.find(x=>x.id===a.cellId);if(!c)return;
    people(c).forEach((p,i)=>{const s=a.records?.[`${p.role}:${p.name}:${i}`]||"";rows.push([a.date,c.name,p.name,p.role,s==="present"?"출석":s==="late"?"지각":s==="absent"?"결석":""])});
  });
  const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
  const b=new Blob([csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`청년부_출석_${today()}.csv`;a.click();
};
function renderAll(){renderCells();renderSelect();renderAtt();renderDash()} renderAll();
</script>
</body>
</html>
