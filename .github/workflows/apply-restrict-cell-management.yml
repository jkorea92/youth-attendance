name: Apply restricted cell management
on:
  push:
    branches: [main]
    paths:
      - 'scripts/restrict_cell_management.py'
      - '.github/workflows/apply-restrict-cell-management.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restrict_cell_management.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v4.html
          git commit -m 'Restrict leaders and helpers to own cell roster' || exit 0
          git push
