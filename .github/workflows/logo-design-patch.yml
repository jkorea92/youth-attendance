name: Apply church logo design

on:
  push:
    paths:
      - '.github/workflows/logo-design-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch production and backup HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ('index.html','app-v4.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if '.church-logo{' not in s:
                  s=s.replace('.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:900;font-size:20px}.sub{font-size:12px;opacity:.8;margin-top:3px}', '.top{display:flex;justify-content:space-between;gap:18px;align-items:center}.brandarea{display:flex;align-items:center;gap:14px;min-width:0}.church-logo{width:205px;height:auto;max-height:56px;object-fit:contain;background:#fff;border-radius:10px;padding:6px 9px;box-shadow:0 4px 14px rgba(0,0,0,.12);flex:0 0 auto}.brandcopy{min-width:0}.brand{font-weight:900;font-size:20px}.sub{font-size:12px;opacity:.8;margin-top:3px}.login-logo{display:block;width:min(280px,100%);height:auto;margin:0 auto 18px}.auth{text-align:left}.auth .login-logo+ h2{text-align:center}.auth .authintro{text-align:center}')
                  s=s.replace('@media(max-width:900px){.roster-grid', '@media(max-width:900px){.church-logo{width:170px}.brand{font-size:17px}.roster-grid')
                  s=s.replace('@media(max-width:760px){.s4,.s12', '@media(max-width:760px){.brandarea{width:100%;align-items:flex-start}.church-logo{width:145px}.brand{font-size:15px}.sub{font-size:11px}.s4,.s12')
              old='<header><div class="wrap top"><div><div class="brand">✓ 퍼스백양장로교회 청년부 출석체크</div><div class="sub">온라인 공동 출석관리</div></div><div id="userBox" class="user hidden"><span id="userEmail"></span><span id="roleBadge" class="badge"></span><button id="logout" class="soft">로그아웃</button></div></div></header>'
              new='<header><div class="wrap top"><div class="brandarea"><img src="assets/church-logo.png" alt="퍼스백양장로교회 로고" class="church-logo"><div class="brandcopy"><div class="brand">청년부 출석체크</div><div class="sub">퍼스백양장로교회 · 온라인 공동 출석관리</div></div></div><div id="userBox" class="user hidden"><span id="userEmail"></span><span id="roleBadge" class="badge"></span><button id="logout" class="soft">로그아웃</button></div></div></header>'
              if old in s:
                  s=s.replace(old,new)
              login_old='<section id="loginView" class="auth card"><h2>로그인</h2><div class="muted">청년부 출석관리 계정으로 로그인하세요.</div>'
              login_new='<section id="loginView" class="auth card"><img src="assets/church-logo.png" alt="퍼스백양장로교회 로고" class="login-logo"><h2>청년부 출석관리</h2><div class="muted authintro">기존 계정으로 로그인하거나, 처음 사용하는 경우 계정을 신청하세요.</div>'
              if login_old in s:
                  s=s.replace(login_old,login_new)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit logo design
        shell: bash
        run: |
          if git diff --quiet -- index.html app-v4.html; then
            echo "No HTML changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v4.html
          git commit -m "Add church logo to app header and login"
          git push
