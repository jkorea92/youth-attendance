name: Double click attendance toggle

on:
  push:
    paths:
      - '.github/workflows/double-click-attendance.yml'
      - 'scripts/double_click_attendance.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/double_click_attendance.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v4.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Use double click to clear quick attendance"
            git push
          fi