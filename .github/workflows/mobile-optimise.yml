name: Apply mobile optimisation

"on":
  push:
    paths:
      - '.github/workflows/mobile-optimise.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = '''
/* mobile-optimisation-20260909 */
html,body{max-width:100%;overflow-x:hidden}
.church-logo{display:block;width:205px;max-width:100%;height:auto;max-height:none;object-fit:contain;padding:5px 8px}
.login-logo{max-width:100%;height:auto;object-fit:contain}
@media(max-width:760px){
body{font-size:15px}header{padding:12px 0}.wrap{padding-left:12px;padding-right:12px}.top{gap:10px;width:100%}.brandarea{width:100%;display:grid;grid-template-columns:1fr;gap:8px;align-items:center}.church-logo{width:min(260px,78vw);max-height:none;margin:0 auto;padding:5px 7px;border-radius:9px}.brandcopy{text-align:center;width:100%}.brand{font-size:17px;line-height:1.25}.sub{font-size:11px;line-height:1.35}.user{width:100%;justify-content:center;gap:6px;font-size:12px}#userEmail{max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font-size:10px;padding:5px 8px}#logout{padding:8px 11px}.auth{margin:18px auto;max-width:100%;width:100%}.auth.card{padding:16px}.login-logo{width:min(285px,88vw);margin-bottom:14px}h2{font-size:22px}h3{font-size:18px}input,select,textarea{font-size:16px;min-height:44px}button{min-height:42px;font-size:14px}.tabs{width:calc(100vw - 24px);max-width:none;margin:12px 0;padding:4px;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;justify-content:flex-start;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;white-space:nowrap;padding:10px 12px}.grid{gap:10px}.card{padding:14px;border-radius:14px}.s4,.s12{grid-column:span 12}#cells .card[style]{grid-column:span 12!important}.row{grid-template-columns:1fr;gap:8px}.stat{font-size:27px}.cell{padding:12px;border-radius:12px}.celltop{align-items:flex-start;gap:8px}.metrics{gap:5px}.metric{font-size:10px;padding:5px 7px}.roster-grid{grid-template-columns:1fr;gap:7px}.roster-group{min-height:0}#attend .table{border:0;overflow:visible}#attend table,#attend tbody{display:block;width:100%}#attend thead{display:none}#attBody tr{display:block;width:100%;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;box-shadow:0 3px 10px rgba(40,55,90,.04)}#attBody tr.longrow{background:#fbf9ff}#attBody td{display:grid;grid-template-columns:74px minmax(0,1fr);align-items:center;gap:8px;width:100%;padding:7px 2px;border:0}#attBody td:nth-child(1)::before{content:'이름';font-size:11px;font-weight:800;color:var(--muted)}#attBody td:nth-child(2)::before{content:'역할';font-size:11px;font-weight:800;color:var(--muted)}#attBody td:nth-child(3)::before{content:'출석';font-size:11px;font-weight:800;color:var(--muted)}#attBody td:nth-child(4)::before{content:'장기결석';font-size:11px;font-weight:800;color:var(--muted)}#attBody td[colspan]{display:block;padding:12px}#attBody td[colspan]::before{content:none!important}#attBody .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;width:100%}#attBody .att{width:100%;padding:9px 5px;font-size:12px;white-space:nowrap}#attBody td:nth-child(4) .att{max-width:160px}#allPresent,#saveAtt{flex:1 1 0}#users .table{overflow-x:auto;-webkit-overflow-scrolling:touch}#users table{min-width:700px}#cellList .celltop{flex-direction:column}#cellList .danger{align-self:flex-end}}
@media(max-width:390px){.wrap{padding-left:9px;padding-right:9px}.tabs{width:calc(100vw - 18px)}.church-logo{width:min(245px,84vw)}.brand{font-size:16px}.card{padding:12px}#attBody td{grid-template-columns:64px minmax(0,1fr)}#attBody .att{font-size:11px;padding:8px 3px}}
'''
          for name in ('index.html','app-v4.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if '/* mobile-optimisation-20260909 */' not in s:
                  s=s.replace('</style>', css+'\n</style>', 1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v4.html
          git diff --cached --quiet || git commit -m "Optimise mobile layout and logo sizing"
          git push
