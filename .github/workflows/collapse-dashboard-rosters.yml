name: Collapse dashboard rosters
on:
  push:
    paths:
      - '.github/workflows/collapse-dashboard-rosters.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collapse dashboard roster details by default
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in [Path('index.html'), Path('app-v4.html')]:
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              old=s
              s=s.replace('<details class="roster" open>', '<details class="roster">')
              s=s.replace('<details open class="roster">', '<details class="roster">')
              if s==old:
                  print(f'No open dashboard roster marker found in {p}')
              else:
                  p.write_text(s,encoding='utf-8')
                  print(f'Patched {p}')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v4.html
          git diff --cached --quiet || git commit -m 'Collapse dashboard rosters by default'
          git push
