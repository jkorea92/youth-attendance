name: Quick attendance UI

on:
  push:
    paths:
      - '.github/workflows/quick-attendance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply quick attendance UI
        run: python3 tools/apply-quick-attendance.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v4.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add quick attendance workflow to attendance screen"
            git push
          fi
