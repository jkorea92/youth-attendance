name: Move member note below
on:
  push:
    branches: [main]
    paths:
      - 'scripts/move_member_note_below.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/move_member_note_below.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v4.html
          git commit -m 'Move member note below and enlarge field' || exit 0
          git push
