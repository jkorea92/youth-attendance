name: Fix church logo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-church-logo.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch app to reliable vector logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['index.html','app-v4.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'assets/church-logo\.png(?:\?[^"\']*)?', 'assets/church-logo.svg?v=vector-20260909', s)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v4.html
          git commit -m 'Use vector church logo in app' || exit 0
          git push
