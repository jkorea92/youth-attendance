name: Add attendance clear controls

on:
  push:
    paths:
      - '.github/workflows/add-attendance-clear.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply attendance clear patch
        run: python3 scripts/add_attendance_clear.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v4.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add attendance clear controls"
            git push
          fi
