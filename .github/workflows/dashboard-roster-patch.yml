name: Patch dashboard roster

on:
  push:
    paths:
      - 'patch_dashboard_roster.py'
      - '.github/workflows/dashboard-roster-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app-v4 dashboard
        run: python patch_dashboard_roster.py
      - name: Commit app change
        run: |
          if git diff --quiet -- app-v4.html; then
            echo "No app changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v4.html
          git commit -m "Show attendance member rosters on dashboard"
          git push
