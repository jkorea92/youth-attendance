name: Apply attendance participation model
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_attendance_types.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_attendance_types.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v4.html
          git commit -m 'Add worship and cell attendance types with member notes' || exit 0
          git push
