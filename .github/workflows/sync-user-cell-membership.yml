name: Apply user cell membership sync

on:
  push:
    paths:
      - 'tools/sync-user-cell-membership.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/sync-user-cell-membership.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html app-v4.html firestore.rules; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v4.html firestore.rules
          git commit -m "Sync user roles with cell roster"
          git push
