name: Apply mobile fix

on:
  push:
    paths:
      - '.github/workflows/mobile-fix-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch production and backup HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          mobile_css = "/* mobile-fix-20260909 */\nhtml,body{max-width:100%;overflow-x:hidden}\n.church-logo{display:block;width:205px;max-width:100%;height:auto;max-height:none;object-fit:contain;padding:5px 8px}\n.login-logo{max-width:100%;height:auto;object-fit:contain}\n@media(max-width:760px){body{font-size:15px}header{padding:12px 0}.wrap{padding-left:12px;padding-right:12px}.top{gap:10px;width:100%;align-items:stretch}.brandarea{width:100%;display:grid;grid-template-columns:1fr;gap:8px;align-items:center}.church-logo{width:min(260px,78vw);max-height:none;margin:0 auto;padding:5px 7px}.brandcopy{text-align:center}.brand{font-size:17px;line-height:1.25}.sub{font-size:11px;line-height:1.35}.user{width:100%;justify-content:center;gap:6px;font-size:12px}#userEmail{max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.auth{margin:18px auto;max-width:100%;width:100%}.auth.card{padding:16px}.login-logo{width:min(285px,88vw);margin-bottom:14px}input,select,textarea{font-size:16px;min-height:44px}button{min-height:42px}.tabs{width:calc(100vw - 24px);max-width:none;margin:12px 0;padding:4px;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;justify-content:flex-start;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;white-space:nowrap;padding:10px 12px}.grid{gap:10px}.card{padding:14px}.s4,.s12{grid-column:span 12}#cells .card[style]{grid-column:span 12!important}.row{grid-template-columns:1fr}.stat{font-size:27px}.roster-grid{grid-template-columns:1fr}.celltop{align-items:flex-start}.metrics{gap:5px}#attend .table{border:0;overflow:visible}#attend table,#attend tbody{display:block;width:100%}#attend thead{display:none}#attBody tr{display:block;width:100%;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px}#attBody td{display:grid;grid-template-columns:74px minmax(0,1fr);align-items:center;gap:8px;width:100%;padding:7px 2px;border:0}#attBody td:nth-child(1)::before{content:'이름';font-size:11px;font-weight:800;color:var(--muted)}#attBody td:nth-child(2)::before{content:'역할';font-size:11px;font-weight:800;color:var(--muted)}#attBody td:nth-child(3)::before{content:'출석';font-size:11px;font-weight:800;color:var(--muted)}#attBody td:nth-child(4)::before{content:'장기결석';font-size:11px;font-weight:800;color:var(--muted)}#attBody td[colspan]{display:block}#attBody td[colspan]::before{content:none!important}#attBody .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;width:100%}#attBody .att{width:100%;padding:9px 5px;font-size:12px;white-space:nowrap}#allPresent,#saveAtt{flex:1 1 0}#users .table{overflow-x:auto;-webkit-overflow-scrolling:touch}#users table{min-width:700px}#cellList .celltop{flex-direction:column}}\n@media(max-width:390px){.wrap{padding-left:9px;padding-right:9px}.tabs{width:calc(100vw - 18px)}.church-logo{width:min(245px,84vw)}.card{padding:12px}#attBody td{grid-template-columns:64px minmax(0,1fr)}#attBody .att{font-size:11px;padding:8px 3px}}"
          for name in ('index.html','app-v4.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if '/* mobile-fix-20260909 */' not in s:
                  s=s.replace('</style>', mobile_css+'\n</style>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit mobile fix
        shell: bash
        run: |
          if git diff --quiet -- index.html app-v4.html; then
            echo "No HTML changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v4.html
          git commit -m "Optimise mobile layout and fix logo sizing"
          git push
