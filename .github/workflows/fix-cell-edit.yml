name: Fix cell edit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cell-edit.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python3 tools/fix-cell-edit.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v4.html
          git commit -m 'Allow editing existing cell rosters' || exit 0
          git push