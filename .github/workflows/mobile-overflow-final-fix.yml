name: Mobile overflow final fix
on:
  push:
    branches: [main]
    paths:
      - 'scripts/mobile_overflow_final_fix.py'
      - '.github/workflows/mobile-overflow-final-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/mobile_overflow_final_fix.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app-v4.html
          git commit -m 'Fix mobile clipping and overlap across all tabs'
          git push
